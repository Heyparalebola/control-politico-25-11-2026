:root{
  --paper:#F5FAF7; --panel:#FFFFFF; --ink:#14261C; --ink2:#2B3D33; --muted:#53655B; --line:#D3E5DA; --soft:#EDF6F0;
  --brand:#157A45; --brand-soft:#E6F8EE; --mint:#E6F8EE; --green:#3ECF86; --blue:#3AA9FF; --sun:#F5D76E; --coral:#F27A7A;
  --rojo:#B42318; --rojo-soft:#FDE7E6; --ambar:#7A5B00; --ambar-dot:#F5D76E; --ambar-soft:#FCF3D1; --verde:#157A45; --verde-dot:#3ECF86; --verde-soft:#DDF5E8;
  --gris:#53655B; --gris-soft:#EEF3F0;
  /* Tipos de respuesta (color + ícono + texto) */
  --t-completa:#157A45; --t-parcial:#F5D76E; --t-generica:#F2A65A; --t-remision:#7CC4FF; --t-traslado:#8E7CC3; --t-noresp:#B42318;
  --radius:6px; --shadow:0 1px 2px rgba(20,38,28,.08);
  --font:"Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
a{color:var(--brand)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--panel);padding:8px}
h1,h2,h3,h4{line-height:1.2;margin:0}
/* ---------- Cabecera ---------- */
.apph{position:sticky;top:0;z-index:30;background:var(--mint);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 20px}
.brand{font-weight:800;font-size:1rem;color:var(--brand);text-decoration:none;margin-right:auto;line-height:1.15}
.brand small{display:block;font-weight:600;font-size:.74rem;color:var(--muted)}
.levels{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.levels li{font-size:.76rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--panel)}
.levels li b{display:inline-block;min-width:1.1em;text-align:center}
.levels li.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--green)}
.levels li.off{opacity:.45;text-decoration:line-through}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:.82rem;font-weight:700;cursor:pointer;min-height:34px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:700;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.small{padding:5px 11px;font-size:.8rem;min-height:30px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:6px 20px 8px;border-top:1px solid var(--line);background:var(--panel)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.86rem;margin:0;padding:0;list-style:none;min-width:0;flex:1 1 320px}
.crumbs li{display:flex;align-items:center;gap:4px;min-width:0}
.crumbs li+li::before{content:"›";color:var(--muted);margin:0 2px}
.crumbs a{color:var(--brand);text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.crumbs [aria-current]{font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.filters{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.82rem;min-height:32px;background:var(--panel);max-width:200px}
.filters input{width:200px}
.searchwrap{position:relative}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:60vh;overflow:auto;z-index:40;display:none}
.results.on{display:block}
.results .grp{font-size:.72rem;font-weight:800;color:var(--muted);padding:8px 12px 2px;text-transform:uppercase;letter-spacing:.03em}
.results a{display:block;padding:7px 12px;font-size:.88rem;color:var(--ink);text-decoration:none}
.results a:hover,.results a:focus{background:var(--brand-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 8px;background:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 4px 2px 10px}
.chip button{border:0;background:none;cursor:pointer;font-weight:800;padding:0 6px;min-height:24px}
.mfilt{display:none}
/* ---------- Vista ---------- */
main{max-width:1280px;margin:0 auto;padding:14px 20px 60px}
main:focus{outline:none}
.view-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:14px}
.view-h h1{font-size:1.5rem;font-weight:800;color:var(--brand)}
.kicker{font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.lead{font-size:1.02rem;color:var(--ink2);max-width:80ch;margin:4px 0 0}
.grid{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
a.card{display:block;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--brand)}
.card h2,.card h3{font-size:1rem;font-weight:800;margin-bottom:6px}
.card>h2{color:var(--ink)}
.sec-t{font-size:1.05rem;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px;color:var(--brand);border-bottom:2px solid var(--green);padding-bottom:5px}
.src{font-size:.76rem;color:var(--muted)}
.big{font-size:2rem;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.muted{color:var(--muted)}
.nr{display:inline-block;font-style:italic;font-weight:700;color:var(--ink2);background:var(--gris-soft);border:1px dashed #9AA5AD;padding:0 6px;border-radius:4px;font-size:.82rem}
.big .nr{font-size:1.1rem;padding:2px 8px}
.pend{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;color:var(--gris);background:repeating-linear-gradient(45deg,var(--gris-soft) 0 4px,#DEE3E6 4px 8px);border-radius:4px;padding:2px 7px}
.rec{display:inline-flex;font-size:.74rem;font-weight:800;color:var(--verde);background:var(--verde-soft);border:1px solid #B5E3C8;border-radius:4px;padding:1px 7px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid #B5E3C8;border-radius:4px;padding:1px 6px;color:var(--brand);background:var(--brand-soft);text-decoration:none}
.tag.nino{border-color:#E9D58A;color:var(--ambar);background:var(--ambar-soft)}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.78rem;color:var(--muted)}
details.fold{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-top:10px}
details.fold>summary{cursor:pointer;padding:10px 14px;font-weight:800;font-size:.9rem;color:var(--brand);list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>.in{padding:0 14px 14px}
.rep{border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;font-weight:700;font-size:1.02rem}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean>li{padding:8px 0;border-bottom:1px solid var(--soft)}
ul.clean>li:last-child{border-bottom:0}
ul.tight{margin:4px 0;padding-left:18px}ul.tight li{margin:3px 0}
.empty{padding:20px;border:1px dashed var(--line);color:var(--muted);text-align:center;border-radius:var(--radius);background:var(--panel)}
.notice{background:var(--mint);border:1px solid var(--green);border-left:4px solid var(--brand);padding:10px 14px;border-radius:var(--radius);font-size:.9rem;margin:10px 0}
.notice.nino{background:var(--ambar-soft);border-color:#E9D58A;border-left-color:var(--ambar)}
[data-src]{text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:help}
#tip{position:fixed;z-index:80;background:var(--ink);color:#fff;font-size:.78rem;padding:6px 9px;border-radius:6px;pointer-events:none;display:none;max-width:340px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--brand)}
/* Tipos de respuesta */
.tp{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;border-radius:4px;padding:2px 7px;white-space:nowrap;border:1px solid rgba(0,0,0,.08)}
.tp i{font-style:normal}
.tp.COMPLETA{background:var(--t-completa);color:#fff}
.tp.PARCIAL{background:var(--t-parcial);color:var(--ink)}
.tp.GENERICA{background:var(--t-generica);color:var(--ink)}
.tp.REMISION{background:var(--t-remision);color:var(--ink)}
.tp.TRASLADO{background:var(--t-traslado);color:#fff}
.tp.NORESP{background:var(--t-noresp);color:#fff}
.tp.SINRESP{color:var(--gris);background:repeating-linear-gradient(45deg,var(--gris-soft) 0 4px,#DEE3E6 4px 8px)}
.stk{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.stk>span{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;min-width:0;overflow:hidden;white-space:nowrap}
.stk>span.COMPLETA{background:var(--t-completa);color:#fff}.stk>span.PARCIAL{background:var(--t-parcial)}.stk>span.GENERICA{background:var(--t-generica)}
.stk>span.REMISION{background:var(--t-remision)}.stk>span.TRASLADO{background:var(--t-traslado);color:#fff}.stk>span.NORESP{background:var(--t-noresp);color:#fff}
.stk>span.SINRESP{background:repeating-linear-gradient(45deg,#F7F9FA 0 5px,#DEE3E6 5px 10px);color:var(--gris)}
.stkrow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--soft);text-decoration:none;color:var(--ink)}
.stkrow:last-child{border-bottom:0}
a.stkrow:hover b{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.8rem;color:var(--muted);margin:6px 0 10px;align-items:center}
/* ---------- Nivel 0 ---------- */
.l0{display:grid;gap:12px}
.headline{color:var(--brand);font-size:1.4rem;font-weight:800;line-height:1.25;max-width:70ch}
.msgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.msg{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-top:3px solid var(--green)}
.msg .big{font-size:1.6rem;color:var(--brand)}
.msg .det{font-size:.84rem;font-weight:700;color:var(--ink2)}
.msg .ctx{font-size:.88rem;line-height:1.35;color:var(--ink2)}
.msg .src{margin-top:auto;padding-top:4px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);text-decoration:none;color:var(--ink)}
.kpi:hover{border-color:var(--brand)}
.kpi .k{font-size:.74rem;font-weight:700;color:var(--muted);line-height:1.2}
.kpi .v{font-size:1.3rem;font-weight:800;line-height:1.1}
.kpi .d{font-size:.72rem;color:var(--muted);line-height:1.25}
.l0row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.ents{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
.ent{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;text-decoration:none;color:var(--ink);font-size:.8rem;font-weight:700;line-height:1.2;background:var(--panel)}
.ent:hover{border-color:var(--brand)}
.ent.p{color:var(--gris);background:repeating-linear-gradient(45deg,#F7F9FA 0 5px,var(--gris-soft) 5px 10px)}
.prog{height:14px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog>span{display:block;height:100%;background:var(--brand)}
.alta-box{display:flex;flex-direction:column;justify-content:center;gap:4px;border-left:6px solid var(--rojo);background:var(--panel)}
.alta-box .big{color:var(--rojo)}
.sem{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-top:6px solid var(--gris);border-radius:6px;padding:7px 9px;text-decoration:none;color:var(--ink);background:var(--panel);min-height:84px}
.st:hover{border-color:var(--brand)}
.st .nm{font-size:.82rem;font-weight:800;line-height:1.2}
.st .cv{font-size:.72rem;color:var(--muted);margin-top:auto}
.st .lb{font-size:.72rem;font-weight:800}
.st.rojo{border-top-color:var(--rojo)} .st.rojo .lb{color:var(--rojo)}
.st.amarillo{border-top-color:var(--ambar-dot)} .st.amarillo .lb{color:var(--ambar)}
.st.verde{border-top-color:var(--verde-dot)} .st.verde .lb{color:var(--verde)}
.st.gris{border-top-color:#9AA5AD;background:repeating-linear-gradient(45deg,#F7F9FA 0 5px,var(--gris-soft) 5px 10px)} .st.gris .lb{color:var(--gris)}
.st.dim,.ent.dim{opacity:.35}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;border:1px solid rgba(0,0,0,.25)}
.dot.rojo{background:var(--rojo)}.dot.amarillo{background:var(--ambar-dot)}.dot.verde{background:var(--verde-dot)}.dot.gris{background:repeating-linear-gradient(45deg,#E2E6E9 0 3px,#9AA5AD 3px 6px)}
.semlbl{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.86rem;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--panel)}
.explore{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.explore a{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--panel);text-decoration:none;color:var(--ink);font-weight:800;font-size:.9rem}
.explore a:hover{border-color:var(--brand);color:var(--brand)}
.explore a span{font-weight:600;font-size:.76rem;color:var(--muted)}
.central{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
.central .card{border-left:5px solid var(--brand)}
.central h3{color:var(--brand);font-size:1.02rem}
/* ---------- Nivel 1 ---------- */
.ejes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.two>*,.grid>*{min-width:0}
.kfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:10px}
.kfig .card .big{font-size:1.5rem}
.entrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:10px;align-items:center}
.contra a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink)}
.contra a:hover .t{text-decoration:underline}
.contra .t{font-weight:700}
.qlist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;text-decoration:none;color:var(--ink);align-items:center}
.qlist a:hover .t{text-decoration:underline}
.idx{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;border-radius:6px;font-weight:800;font-size:.86rem;border:1px solid var(--line)}
.idx.rojo{background:var(--rojo-soft);color:var(--rojo)}.idx.amarillo{background:var(--ambar-soft);color:var(--ambar)}.idx.verde{background:var(--verde-soft);color:var(--verde)}.idx.gris{background:var(--gris-soft);color:var(--gris)}
/* barras nativas */
.hb{display:grid;grid-template-columns:minmax(110px,220px) minmax(0,1fr);gap:4px 12px;align-items:center;font-size:.84rem}
.hb .lbl{font-weight:700;line-height:1.2}
.hb .bars{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px solid var(--soft)}
.hb .b{display:flex;align-items:center;gap:8px;min-height:18px}
.hb .b>i{display:block;height:14px;border-radius:3px;min-width:2px}
.hb .b>i.ap{background:var(--brand)}.hb .b>i.co{background:var(--blue)}.hb .b>i.pa{background:var(--green)}.hb .b>i.tot{background:var(--q1,#CDEBD9)}.hb .b>i.req{background:var(--rojo)}
.hb .b small{font-size:.74rem;color:var(--muted);white-space:nowrap}
.lg i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* ---------- Nivel 2 ---------- */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.88rem;margin:0}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
.cnts{display:flex;flex-wrap:wrap;gap:6px}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px;margin:10px 0}
.side .v{border:1px solid var(--line);border-top:4px solid var(--green);border-radius:6px;padding:10px 12px;background:var(--panel);font-size:.95rem}
.side .v .who{font-size:.74rem;font-weight:800;color:var(--brand);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.side .v .src{display:block;margin-top:6px}
.qcard{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--panel);margin:8px 0}
.qcard.done{background:#F1F8F3;border-color:#B5E3C8}
.qcard .q{font-weight:800;font-size:1rem}
.qcard .m{font-size:.86rem;color:var(--ink2);margin-top:6px}
.qcard .m b{color:var(--muted)}
.qcard .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.qcard label{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700}
/* Diagrama y mapa */
#diagram svg{width:100%;height:auto;max-height:440px}
#map{position:relative;height:460px;border:1px solid var(--line);border-radius:var(--radius);background:#EAF2F7;overflow:hidden;touch-action:none}
#map svg{width:100%;height:100%;display:block;cursor:grab}
#map .dep{fill:#F3F6F4;stroke:#A9B7AE;stroke-width:.8}
#map .dep.on{fill:#FFFFFF;stroke:#53655B;stroke-width:1.2}
#map .dlab{fill:#2B3D33;opacity:.8;text-anchor:middle;font-weight:800;pointer-events:none;font-family:var(--font)}
#map circle{cursor:pointer}
.mapctl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:1.05rem;cursor:pointer}
.mapinfo{position:absolute;right:8px;bottom:8px;max-width:min(320px,80%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 26px 8px 10px;font-size:.84rem;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.mapinfo .x{position:absolute;top:2px;right:4px;border:none;background:none;font-size:1.1rem;cursor:pointer}
.flag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid #E9D58A;border-radius:4px;padding:0 5px;margin:1px 2px 1px 0;background:var(--ambar-soft);color:var(--ambar);white-space:nowrap}
/* ---------- Nivel 3 ---------- */
table.data{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--panel)}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.data th{background:var(--soft);font-weight:800;font-size:.8rem;position:sticky;top:0;white-space:nowrap;color:var(--ink)}
table.data th[data-k]{cursor:pointer}
table.data th[aria-sort=ascending]::after{content:" ▲"}table.data th[aria-sort=descending]::after{content:" ▼"}
table.data td.num{text-align:right;white-space:nowrap}
.tablewrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
.tablewrap table{min-width:560px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:34px;background:var(--panel)}
.toolbar label{display:inline-flex;gap:6px;align-items:center;font-size:.84rem;font-weight:700}
.matrix{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.matrix table{border-collapse:separate;border-spacing:3px}
.matrix th{font-size:.74rem;color:var(--muted);font-weight:800;padding:2px 4px;text-align:center}
.matrix th.rh{text-align:left;position:sticky;left:0;background:var(--panel);color:var(--ink);white-space:nowrap}
.cell{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid rgba(0,0,0,.08);border-radius:4px;font-size:.8rem;font-weight:800;text-decoration:none;color:var(--ink)}
.cell.COMPLETA{background:var(--t-completa);color:#fff}.cell.PARCIAL{background:var(--t-parcial)}.cell.GENERICA{background:var(--t-generica)}.cell.REMISION{background:var(--t-remision)}.cell.TRASLADO{background:var(--t-traslado);color:#fff}.cell.NORESP{background:var(--t-noresp);color:#fff}
.cell.SINRESP{background:repeating-linear-gradient(45deg,#F7F9FA 0 5px,var(--gris-soft) 5px 10px);color:var(--gris)}
.cell.dim{opacity:.2}
/* ---------- Modo debate ---------- */
#debate{position:fixed;inset:0;z-index:60;background:#0E1712;color:#E2F1E8;display:flex;flex-direction:column}
#debate[hidden]{display:none}
.dbh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #26392E;background:#14211A}
.dbh h2{font-size:1rem;font-weight:800;margin-right:auto;color:#3ECF86}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid #26392E;background:#14211A}
.dtabs button{flex:none;border:1px solid #26392E;background:transparent;color:#E2F1E8;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.84rem;cursor:pointer;min-height:36px}
.dtabs button[aria-selected="true"]{background:#3ECF86;color:#0E1712;border-color:#3ECF86}
.dtabs button.p{opacity:.65}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.dcard{flex:0 0 100%;scroll-snap-align:center;overflow-y:auto;padding:18px max(16px,calc((100% - 860px)/2)) 24px}
.dcard .kq{font-size:.8rem;font-weight:800;color:#97AEA2;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dcard .q{font-size:1.45rem;font-weight:800;line-height:1.3;margin:8px 0 14px}
.dcard .fig{background:#E6F8EE;color:#14261C;border-left:5px solid #3ECF86;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.dcard .fig .big{font-size:1.5rem;color:#157A45}
.dcard .blk{border:1px solid #26392E;background:#14211A;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.dcard .blk h4{font-size:.78rem;font-weight:800;color:#3ECF86;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.dcard .blk p{margin:0;font-size:1.02rem}
.dcard .vs2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.dcard .srcd{font-size:.8rem;color:#97AEA2}
.dcard .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 10px}
.dcard label{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid #26392E;background:#14211A}
.dnav button{min-width:120px}
#debate .btn{background:#3ECF86;color:#0E1712;border-color:#3ECF86}
#debate .btn.ghost{background:transparent;color:#E2F1E8;border-color:#26392E}
#debate .tp{border-color:rgba(255,255,255,.2)}
/* ---------- Responsive ---------- */
#printSummary{display:none}
@media (max-width:1500px){.levels li:not(.on) span{display:none}.brand small{font-size:.7rem}}
@media (max-width:1100px){
  .ents{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
}
@media (max-width:760px){
  .row1{padding:8px 12px}.row2{padding:6px 12px 8px}.chips{padding:0 12px 8px}
  main{padding:14px 12px 60px}
  .levels li span{display:none}
  .apph{position:static}
  .brand{flex-basis:100%;margin-right:0}
  #bPrintSum,#bPrintView{display:none}
  .row1{gap:6px 8px}
  .crumbs{flex:1 1 0}
  .seg button{padding:6px 10px}
  .filters{display:none;width:100%}
  .apph.fo .filters{display:flex}
  .filters select,.filters input,.filters .searchwrap{flex:1 1 100%;max-width:none;width:100%}
  .mfilt{display:inline-flex}
  .headline{font-size:1.2rem}
  .msgs{grid-template-columns:1fr}
  .msg{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
  .msg .big{font-size:1.45rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .l0row{grid-template-columns:1fr}
  .ents{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sem{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st{min-height:0}
  .entrow{grid-template-columns:minmax(0,1fr) 64px}
  .entrow .bar{display:none}
  .stkrow{grid-template-columns:1fr 40px}.stkrow .stk{grid-column:1/-1;grid-row:2}
  .crumbs [aria-current]{max-width:28ch}
  .dcard .q{font-size:1.2rem}
  .dcard .vs2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .hb{grid-template-columns:1fr}
  #map{height:380px}
}
@media print{
  @page{size:A4;margin:12mm 11mm}
  body{background:#fff;font-size:10pt}
  .apph,#debate,#tip,.noprint,.results,.dnav,.mapctl,.mapinfo{display:none!important}
  main{max-width:none;padding:0}
  .card,details.fold,.qcard{box-shadow:none;break-inside:avoid}
  details.fold>summary::before{content:""}
  .tablewrap{max-height:none;overflow:visible;border:0}
  table.data th{position:static}
  [data-src]{text-decoration:none}
  a{color:inherit;text-decoration:none}
  .st,.ent,.cell,.dot,.tp,.stk>span,.pend,.prog>span,.bar>span,.alta-box,.hb i,.idx{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  #map{height:110mm;break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  body.ps main{display:none!important}
  body.ps #printSummary{display:block}
  #printSummary{font-size:8.6pt;line-height:1.3}
  #printSummary .pg{break-after:page}
  #printSummary .pg:last-child{break-after:auto}
  #printSummary .headline{font-size:14pt}
  #printSummary .msgs{grid-template-columns:repeat(5,1fr);gap:6px}
  #printSummary .msg .big{font-size:12pt}
  #printSummary .msg .ctx,#printSummary .msg .det{font-size:8pt}
  #printSummary .card{padding:6px 8px}
  #printSummary .kpis{grid-template-columns:repeat(6,1fr);gap:4px}
  #printSummary .sem{grid-template-columns:repeat(7,1fr);gap:4px}
  #printSummary .st{min-height:0;padding:5px 6px}
  #printSummary .ents{grid-template-columns:repeat(6,1fr)}
  #printSummary .l0row{grid-template-columns:2fr 1fr}
  #printSummary section[aria-label="Explorar"]{display:none}
  #printSummary .msg .src{font-size:7pt}
  #printSummary .l0{gap:6px}
  #printSummary .pej{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #printSummary .pe{border:1px solid var(--line);border-left:5px solid var(--gris);border-radius:5px;padding:5px 7px;break-inside:avoid}
  #printSummary .pe.rojo{border-left-color:var(--rojo)}#printSummary .pe.amarillo{border-left-color:var(--ambar-dot)}#printSummary .pe.verde{border-left-color:var(--verde-dot)}
  #printSummary .pe h3{font-size:9.5pt;margin-bottom:2px}
  #printSummary .pe p{margin:2px 0}
  #printSummary .pe ul,#printSummary ol{margin:2px 0;padding-left:14px}
  #printSummary h2.ph{font-size:12pt;margin:0 0 6px;color:var(--brand)}
  #printSummary .bq{break-inside:avoid;margin:0 0 6px}
  #printSummary .bq h3{font-size:10pt;margin:6px 0 2px}
  #printSummary .bq li{margin:2px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Apartado H. S. Amaya */
.amb{border-left:6px solid var(--ambar-dot);background:linear-gradient(90deg,#FFFBEA,#fff)}
.ambg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.ambb{display:flex;flex-direction:column;gap:8px}
.btn.amy{background:var(--ambar-dot);border-color:#E3C24A;color:var(--ink)}

.prq{background:var(--brand-soft);border-radius:6px;padding:6px 10px}

  "guion": "[0:00-0:20] Gracias, señor presidente. Saludo a la señora ministra de Minas y Energía; a los presidentes de Ecopetrol, de la Agencia Nacional de Minería y de la Agencia Nacional de Hidrocarburos; y a la senadora citante, Zandra Bernal, cuyo cuestionario comparto.\n\n[0:20-1:10] APERTURA. Señora ministra: el Senado envió veintiocho preguntas. Siete tienen respuesta de fondo, y ninguna la firmó el Ministerio [expediente Prop. 39]. Trece le volvieron a su despacho por traslado de la ANH el 28 de septiembre y siguen sin respuesta [ANH 20266411356421, pp. 1-2]. La UPME, que respondió por traslado, escribió que la evaluación de la política le corresponde al Ministerio [UPME 202601000318891, pp. 1-2 y 5]. Usted asumió en agosto y no responde por decisiones anteriores. Por eso no vengo a repetir el balance del cuatrienio: vengo a pedirle a quien gobierna hoy metas, fechas y responsables.\n\n[1:10-2:30] BLOQUE 1. GAS: RECONOZCO LAS CAUSAS, PIDO EL PLAN. Los campos maduros declinan y El Niño exige más gas para las térmicas; lo documentan la UPME y la Superintendencia [UPME, pp. 3-6; SSPD 20262005333451, p. 4]. Lo reconozco. Pero los números del propio Gobierno son estos: las reservas probadas de gas bajaron de 2.817 a 1.717 gigapiés cúbicos entre 2022 y 2025 [ANH 20266411357851, p. 4], con incorporación neta negativa de 29 [ANH, p. 3], y no se firmó ningún contrato nuevo de exploración y producción [ANH, p. 5]. En 2024 el 19 % del gas fue importado [UPME, p. 6]; en octubre de 2026 fue el 41 %, a 25 dólares el millón de BTU, frente a 6 del gas nacional en firme [Gestor del Mercado, informe oct-2026]. Tres preguntas concretas: ¿cuál es la meta de gas importado para diciembre de 2027? ¿En qué fecha entran las regasificadoras de La Guajira y del Pacífico, adoptadas en la Resolución 40031 de 2025 [UPME, pp. 4-5]? ¿Habrá ronda de contratos en 2027, y en qué mes?\n\n[2:30-3:30] BLOQUE 2. LA CALIDAD DE LO QUE RECIBIÓ EL CONGRESO. Al presidente de la ANH: su oficio dice que las reservas de gas caen 300 gigapiés al año; su propia gráfica muestra 1.100 en tres años [ANH, pp. 3-4]. Le pido corregir ese dato por escrito. Su histórico oficial también muestra que, de 1.094 millones de barriles incorporados entre 2022 y 2025, solo 15 vinieron de descubrimientos nuevos; el resto son revisiones de campos existentes [ANH, Histórico de Reservas 2007-2025]. Al presidente de la ANM: no respondió ninguna de las diecisiete preguntas mineras; diez se las pasó a la ANH, que es de hidrocarburos, y la ANH las devolvió al Ministerio [ANH 20266411356421, pp. 1-2]. Y Ecopetrol, citada en la proposición, no envió oficio [OD, p. 2].\n\n[3:30-4:30] BLOQUE 3. BOYACÁ. Ningún oficio menciona Boyacá, y la única pregunta que nombra al departamento, sobre empleo minero, quedó sin respuesta [OD, p. 3]. La producción de carbón de Boyacá bajó de 2,7 a 1,8 millones de toneladas entre 2023 y 2024 [MME, memoria Boyacá Norte, jul-2026]. En octubre el Gobierno derogó los distritos mineros [Res. MME 40579 de 2026]. Señora ministra: ¿qué los reemplaza para los municipios carboneros, con qué recursos y en qué fecha? ¿Qué medida específica tiene para el carbón metalúrgico, que alimenta la siderurgia de Boyacá? Y la industria del corredor Tunja-Duitama-Sogamoso tiene en firme solo el 37 % del gas que necesita en 2027 [Gobernación de Boyacá, informe Prop. 37, nov-2026]: ¿cómo la protegerá en un racionamiento?\n\n[4:30-5:00] CIERRE. Señor presidente: radico hoy una solicitud para que el Ministerio, la ANM y Ecopetrol respondan por escrito las preguntas pendientes, con metas, fechas y responsables, en el término de ley. Y propongo una sesión de seguimiento en marzo de 2027 para verificar esos compromisos. Muchas gracias.",

document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-src]");if(el)showTip(el,e.clientX,e.clientY);});
document.addEventListener("mousemove",e=>{const el=e.target.closest("[data-src]");if(el)showTip(el,e.clientX,e.clientY);else tip.style.display="none";});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-src]");if(el){const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom);}});
document.addEventListener("focusout",()=>tip.style.display="none");
const TOUCH=()=>matchMedia("(hover: none)").matches;
document.addEventListener("click",e=>{if(!TOUCH())return;const el=e.target.closest("[data-src]");if(!el||el.closest("a")){if(tip._pin){tip.style.display="none";tip._pin=null;}return;}
  if(tip._pin===el){tip.style.display="none";tip._pin=null;return;}const r=el.getBoundingClientRect();showTip(el,Math.max(8,r.left),r.bottom);tip._pin=el;},true);
window.addEventListener("scroll",()=>{if(tip._pin){tip.style.display="none";tip._pin=null;}document.body.classList.toggle("compact",window.scrollY>140);},{passive:true});
/* ================= Inicio ================= */
$("#brand").innerHTML=`${esc(DATA.meta.titulo_corto)}<small>${esc(DATA.meta.sesion)} · datos v${esc(DATA.meta.version)} · corte ${fdate(DATA.meta.corte_documentos)}</small>`;
fillFilters();
$("#corte").innerHTML=`Corte ${fdate(DATA.meta.corte_documentos)} · <u>Método</u>`;
document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===MODE)));
window.addEventListener("hashchange",()=>{if(!/^#debate/.test(location.hash)&&location.hash)prevHash=location.hash;});
if(!/^#debate/.test(location.hash))prevHash=location.hash||"#inicio";
render();
})();

</script>
</body>
